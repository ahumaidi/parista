<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E8572B">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>☕</text></svg>">
  <title>PARISTA — Brew the coffee your beans want</title>
  <style>
    :root{
      --orange:#E8572B;--cream:#FFF7E8;--sand:#FBE7BE;--olive:#7C8C4E;
      --olive-dark:#596936;--gold:#FFC64B;--brick:#C1433A;--ink:#33261A;
      --muted:#766554;--line:rgba(51,38,26,.16);--shadow:0 18px 45px rgba(83,28,11,.16);
      --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
      --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --mono:"Space Mono","SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box}
    html{background:var(--orange);scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--cream);background:var(--orange);font-family:var(--sans);line-height:1.5}
    button,input{font:inherit}
    button{color:inherit}
    .app{width:min(100%,760px);margin:auto;padding:clamp(16px,4vw,32px);padding-bottom:64px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.08em}
    .brand svg,.home svg{width:30px;height:30px}
    .home,.icon-btn{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,247,232,.45);border-radius:50%;background:rgba(255,247,232,.1);cursor:pointer}
    .home:hover,.icon-btn:hover{background:rgba(255,247,232,.2)}
    .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800;margin:0 0 10px}
    h1,h2,h3{font-family:var(--serif);line-height:1.05;margin:0}
    h1{font-size:clamp(48px,11vw,82px);letter-spacing:-.045em}
    h2{font-size:clamp(35px,7vw,54px);letter-spacing:-.035em}
    h3{font-size:clamp(23px,4vw,30px);letter-spacing:-.02em}
    p{margin:0}
    .lede{font-size:clamp(18px,3vw,22px);max-width:560px;line-height:1.4;margin-top:14px}
    .woven{height:8px;border-radius:99px;margin:24px 0;background:repeating-linear-gradient(135deg,var(--olive) 0 11px,var(--gold) 11px 18px,var(--olive-dark) 18px 29px,var(--gold) 29px 36px)}
    .actions{display:grid;gap:12px;margin-top:24px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:16px;padding:14px 18px;background:var(--olive);color:var(--cream);font-weight:800;cursor:pointer;box-shadow:0 7px 0 var(--olive-dark);transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 9px 0 var(--olive-dark)}
    .btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--olive-dark)}
    .btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 7px 0 #d69c20}
    .btn.cream{background:var(--cream);color:var(--ink);box-shadow:0 7px 0 #e5c992}
    .btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;box-shadow:none}
    .btn.ghost:hover{box-shadow:none;background:rgba(255,247,232,.1)}
    .btn.small{min-height:44px;width:auto;padding:10px 16px;border-radius:13px;box-shadow:none}
    .text-link{appearance:none;border:0;background:none;text-decoration:underline;text-underline-offset:4px;font-weight:750;cursor:pointer;padding:10px;color:inherit}
    .landing-nav{display:flex;justify-content:flex-end;margin-bottom:36px}
    .landing-art{position:relative;display:grid;place-items:center;height:155px;margin:10px 0 -2px}
    .landing-art .sun{width:135px;height:135px;background:var(--gold);border-radius:50%}
    .landing-art svg{position:absolute;width:154px;height:154px;color:var(--ink)}
    .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
    .choice{min-height:150px;border:0;border-radius:22px;padding:20px;text-align:left;background:var(--cream);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
    .choice:hover{transform:rotate(-.5deg) translateY(-2px)}
    .choice:nth-child(2):hover{transform:rotate(.5deg) translateY(-2px)}
    .choice svg{width:36px;height:36px;color:var(--olive);margin-bottom:22px}
    .choice strong{display:block;font-family:var(--serif);font-size:25px;line-height:1.05}
    .choice span{display:block;color:var(--muted);font-size:14px;margin-top:8px}
    .center{text-align:center}
    .landing-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin-top:8px}
    .screen-intro{margin-bottom:26px}
    .screen-intro p{font-size:17px;margin-top:10px;max-width:600px}
    .card{background:var(--cream);color:var(--ink);border-radius:24px;padding:clamp(20px,4vw,30px);box-shadow:var(--shadow)}
    .card+.card{margin-top:16px}
    .raised{background:var(--sand);box-shadow:none}
    .section{padding:22px 0;border-bottom:1px solid var(--line)}
    .section:first-child{padding-top:0}.section:last-child{border:0;padding-bottom:0}
    .label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--serif);font-size:22px;font-weight:750;margin-bottom:12px}
    .label small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:650}
    .chips{display:flex;flex-wrap:wrap;gap:9px}
    .chip{border:1.5px solid rgba(51,38,26,.25);background:transparent;color:var(--ink);border-radius:99px;padding:9px 13px;font-weight:700;cursor:pointer}
    .chip:hover{border-color:var(--olive)}
    .chip.active{background:var(--olive);border-color:var(--olive);color:var(--cream)}
    .field{width:100%;padding:14px 16px;border:1.5px solid rgba(51,38,26,.25);border-radius:13px;background:#fffdf7;color:var(--ink);outline:none}
    .field:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(124,140,78,.2)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .upload-box{display:grid;place-items:center;text-align:center;min-height:178px;border:2px dashed rgba(51,38,26,.25);border-radius:20px;background:var(--sand);padding:22px}
    .upload-box svg{width:48px;height:48px;color:var(--olive);margin-bottom:10px}
    .status{padding:12px 14px;border-radius:12px;background:var(--sand);font-size:14px;margin-top:14px}
    .status.error{background:#f7d4ca;color:#7a211b}
    .check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .check{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;border:1.5px solid rgba(51,38,26,.23);border-radius:17px;padding:12px;text-align:center;font-size:13px;font-weight:800;cursor:pointer}
    .check input{position:absolute;opacity:0}
    .check:has(input:checked){background:var(--olive);color:var(--cream);border-color:var(--olive)}
    .check svg{width:34px;height:34px}
    .hero-card{overflow:hidden;background:var(--cream);color:var(--ink);border-radius:28px;box-shadow:var(--shadow)}
    .hero-inner{padding:clamp(22px,5vw,36px)}
    .method-head{display:flex;align-items:center;gap:18px}
    .method-icon{display:grid;place-items:center;flex:0 0 auto;width:74px;height:74px;border-radius:50%;background:var(--gold);color:var(--ink)}
    .method-icon svg{width:47px;height:47px}
    .method-head h2{font-size:clamp(34px,7vw,50px)}
    .match{display:inline-flex;margin-top:6px;padding:4px 9px;background:var(--olive);color:var(--cream);border-radius:99px;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
    .why{font-size:18px;margin:20px 0 0}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
    .info{padding:17px;border-radius:17px;background:var(--sand)}
    .info .eyebrow{color:var(--muted);margin-bottom:6px}
    .info strong{font-family:var(--serif);font-size:21px}
    .method-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
    .method-row:last-child{border:0}
    .mini-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--sand)}
    .mini-icon svg{width:31px;height:31px}
    .method-row .grow{flex:1}
    .method-row strong{display:block;font-family:var(--serif);font-size:20px}
    .method-row small{color:var(--muted)}
    .note-list{display:grid;gap:10px;margin:18px 0 0;padding:0;list-style:none}
    .note-list li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--sand);border-radius:13px}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--olive);margin-top:7px;flex:0 0 auto}
    .avoid{color:var(--brick)}
    .recipe-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
    .stat{background:var(--sand);border-radius:15px;padding:14px 8px;text-align:center}
    .stat strong{display:block;font-family:var(--mono);font-size:18px}
    .stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
    .steps{list-style:none;padding:0;margin:20px 0 0;counter-reset:steps}
    .steps li{counter-increment:steps;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
    .steps li:last-child{border:0}
    .steps li:before{content:counter(steps);display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--olive);color:var(--cream);font-family:var(--mono);font-size:13px;font-weight:800}
    .step-time{display:block;font-family:var(--mono);font-size:12px;color:var(--olive-dark);margin-top:3px}
    .method-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .method-tile{border:0;border-radius:20px;padding:18px;text-align:left;background:var(--cream);color:var(--ink);min-height:164px;cursor:pointer;box-shadow:var(--shadow)}
    .method-tile:hover{transform:translateY(-3px)}
    .method-tile .mini-icon{background:var(--gold);margin-bottom:18px}
    .method-tile strong{display:block;font-family:var(--serif);font-size:22px}
    .method-tile small{color:var(--muted)}
    .timer-card{text-align:center;padding-top:32px}
    .step-count{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
    .timer-wrap{position:relative;display:grid;place-items:center;width:260px;height:260px;margin:24px auto}
    .timer-wrap svg.progress{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .track{fill:none;stroke:rgba(51,38,26,.1);stroke-width:5}
    .arc{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-dasharray:691;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear}
    .bloom-ring{position:absolute;width:148px;height:148px;border:2px solid var(--olive);border-radius:50%;opacity:0}
    .running .bloom-ring{animation:bloom 3s infinite}
    .running .bloom-ring:nth-child(2){animation-delay:1s}
    .running .bloom-ring:nth-child(3){animation-delay:2s}
    @keyframes bloom{0%{transform:scale(.65);opacity:.5}100%{transform:scale(1.55);opacity:0}}
    .timer-time{position:relative;font-family:var(--mono);font-weight:800;font-size:39px;letter-spacing:-.05em}
    .timer-actions{display:flex;gap:10px;justify-content:center}
    .timer-actions .btn{width:auto}
    .current-instruction{font-family:var(--serif);font-size:27px;line-height:1.2;min-height:66px;max-width:500px;margin:0 auto}
    .guide-range{display:block;margin:6px auto 14px;color:var(--olive-dark);font-family:var(--mono);font-size:12px;font-weight:700}
    .done-mark{display:grid;place-items:center;width:106px;height:106px;margin:8px auto 22px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--serif);font-size:58px}
    .symptoms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .symptom{border:1.5px solid rgba(51,38,26,.22);border-radius:16px;background:transparent;color:var(--ink);padding:16px;text-align:left;font-weight:800;cursor:pointer}
    .symptom.active{background:var(--olive);color:var(--cream);border-color:var(--olive)}
    .diagnosis{margin-top:16px;padding:20px;background:var(--sand);border-radius:18px}
    .diagnosis ol{margin:12px 0 0;padding-left:22px}.diagnosis li+li{margin-top:8px}
    .empty{padding:38px 20px;text-align:center;color:var(--muted)}
    .empty svg{width:64px;height:64px;margin-bottom:12px;color:var(--olive)}
    .log-date{font-family:var(--mono);font-size:11px;color:var(--muted)}
    .footer-note{text-align:center;font-size:12px;opacity:.82;margin-top:28px}
    .source-note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    .source-note:before{content:"§";display:grid;place-items:center;flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--sand);color:var(--olive-dark);font-family:var(--serif);font-weight:800}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:99px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:10}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){
      .choice-grid,.split{grid-template-columns:1fr}.choice{min-height:125px}.choice svg{margin-bottom:12px}
      .check-grid{grid-template-columns:repeat(2,1fr)}.method-head{align-items:flex-start}.method-icon{width:62px;height:62px}
      .info-grid{grid-template-columns:1fr}.timer-wrap{width:230px;height:230px}.symptoms{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.bloom-ring{animation:none!important}.running .bloom-ring:first-of-type{opacity:.25}}

    /* 2026 visual refresh — quiet specialty-coffee editorial */
    :root{
      --orange:#B9583A;
      --cream:#FFFCF6;
      --sand:#EDE2CF;
      --olive:#69704B;
      --olive-dark:#4D5338;
      --gold:#D6A34E;
      --brick:#A64338;
      --ink:#271D17;
      --muted:#756A60;
      --line:rgba(39,29,23,.13);
      --shadow:0 12px 34px rgba(52,38,27,.08);
    }
    html{background:#F2EADD}
    body{
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 7%,rgba(185,88,58,.07),transparent 28%),
        radial-gradient(circle at 91% 42%,rgba(105,112,75,.06),transparent 26%),
        #F2EADD;
    }
    .app{width:min(100%,980px);padding-top:24px}
    .topbar{margin-bottom:44px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .brand{font-size:17px;letter-spacing:.16em;color:var(--ink)}
    .brand svg{width:26px;height:26px;color:var(--orange)}
    .home,.icon-btn{
      width:40px;height:40px;color:var(--ink);border-color:var(--line);
      background:rgba(255,252,246,.45)
    }
    .home:hover,.icon-btn:hover{background:var(--cream)}
    .landing-nav{margin-bottom:24px}
    h1{font-size:clamp(54px,8.5vw,88px);font-weight:500;line-height:.95;letter-spacing:-.055em}
    h2{font-weight:500}
    h3{font-weight:550}
    .eyebrow{color:var(--orange);font-size:11px;letter-spacing:.19em}
    .lede{color:#574A40;font-size:clamp(18px,2.4vw,21px);max-width:520px}
    .landing-hero{
      display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr);
      gap:clamp(28px,6vw,72px);align-items:center;padding:36px 0 48px
    }
    .landing-copy{position:relative;z-index:1}
    .accent-rule{display:flex;align-items:center;gap:13px;margin-top:28px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.06em}
    .accent-rule:before{content:"";width:74px;height:2px;background:var(--orange)}
    .landing-art{
      position:relative;height:auto;aspect-ratio:4/5;margin:0;
      border-radius:180px 180px 24px 24px;
      overflow:hidden;background:#2E2923;color:#F2EADD;
      box-shadow:22px 24px 0 rgba(105,112,75,.22)
    }
    .landing-art:before{
      content:"";position:absolute;inset:10% -18% auto auto;width:84%;aspect-ratio:1;
      border:1px solid rgba(242,234,221,.16);border-radius:50%
    }
    .landing-art:after{
      content:"";position:absolute;left:-24%;bottom:-17%;width:92%;aspect-ratio:1;
      background:var(--orange);border-radius:50%
    }
    .landing-art .sun{display:none}
    .landing-art>svg{position:relative;z-index:2;width:100%;height:100%;padding:14%;color:#F2EADD}
    .choice-grid{gap:18px;margin-top:4px}
    .choice-grid>.choice:nth-child(3){grid-column:1/-1;min-height:138px}
    .choice{
      position:relative;min-height:168px;border:1px solid var(--line);border-radius:8px;
      padding:24px 26px;background:rgba(255,252,246,.68);box-shadow:none;
      transition:transform .18s,background .18s,border-color .18s
    }
    .choice:after{content:"↗";position:absolute;right:22px;top:20px;color:var(--muted);font-size:19px}
    .choice:hover,.choice:nth-child(2):hover{transform:translateY(-3px);background:var(--cream);border-color:rgba(39,29,23,.28)}
    .choice svg{width:31px;height:31px;margin-bottom:30px;color:var(--orange)}
    .choice strong{font-size:25px;font-weight:550}
    .choice span{font-size:13px}
    .woven{height:5px;opacity:.8;background:repeating-linear-gradient(135deg,var(--olive) 0 12px,var(--gold) 12px 16px,var(--orange) 16px 28px,var(--gold) 28px 32px)}
    .card,.hero-card{border:1px solid rgba(39,29,23,.08);border-radius:14px;background:rgba(255,252,246,.92);box-shadow:var(--shadow)}
    .raised,.info,.note-list li,.diagnosis,.status,.upload-box{background:var(--sand)}
    .btn{
      min-height:50px;border-radius:7px;background:var(--ink);color:var(--cream);
      box-shadow:none;font-size:14px;letter-spacing:.01em;transition:transform .15s,background .15s
    }
    .btn:hover{transform:translateY(-2px);box-shadow:none;background:#3A2C23}
    .btn:active{transform:translateY(0);box-shadow:none}
    .btn.gold{background:var(--orange);color:var(--cream);box-shadow:none}
    .btn.gold:hover{background:#9F472F}
    .btn.cream{background:var(--cream);color:var(--ink);border:1px solid var(--line);box-shadow:none}
    .btn.ghost{color:var(--ink);border:1px solid rgba(39,29,23,.3)}
    .btn.ghost:hover{background:rgba(255,252,246,.55)}
    .text-link{color:var(--ink)}
    .screen-intro{max-width:680px;margin-bottom:34px}
    .screen-intro p{color:#584C42}
    .label{font-size:20px;font-weight:600}
    .chip{border-radius:6px;padding:9px 13px;font-size:13px}
    .chip.active{background:var(--ink);border-color:var(--ink)}
    .field{border-radius:7px;background:#fff}
    .check{border-radius:9px;background:#fffdf8}
    .check:has(input:checked){background:var(--ink);border-color:var(--ink)}
    .method-icon,.mini-icon{background:var(--sand)}
    .match{background:var(--orange)}
    .info{border-radius:8px}
    .method-tile{
      border:1px solid var(--line);border-radius:9px;background:rgba(255,252,246,.78);
      box-shadow:none;transition:transform .18s,background .18s
    }
    .method-tile:hover{background:var(--cream)}
    .method-tile .mini-icon{background:var(--sand)}
    .stat{border-radius:7px}
    .steps li:before{background:var(--ink)}
    .timer-card{background:var(--cream)}
    .done-mark{background:var(--orange);color:var(--cream)}
    .symptom{border-radius:7px;background:#fffdf8}
    .symptom.active{background:var(--ink);border-color:var(--ink)}
    .footer-note{color:var(--muted)}
    .hof-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
    .hof-toolbar .field{flex:1 1 220px}
    .hof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .hof-card{appearance:none;border:1px solid var(--line);border-radius:10px;background:rgba(255,252,246,.88);color:var(--ink);padding:20px;text-align:left;cursor:pointer;min-height:190px;display:flex;flex-direction:column;transition:.18s}
    .hof-card:hover{transform:translateY(-3px);background:var(--cream);border-color:rgba(39,29,23,.3)}
    .hof-card h3{font-size:24px;margin:12px 0 8px}.hof-card p{color:var(--muted);font-size:14px}.hof-card .hof-meta{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:11px;color:var(--olive-dark)}
    .badge{display:inline-flex;align-items:center;width:max-content;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.09em;background:var(--sand);color:var(--ink)}
    .badge.world,.badge.verified{background:var(--olive);color:var(--cream)}
    .badge.adaptation{background:var(--gold);color:var(--ink)}
    .badge.draft{background:var(--brick);color:var(--cream)}
    .timeline-strip{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;margin-bottom:20px;scrollbar-width:thin}
    .timeline-year{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:9px 12px;background:var(--cream);font-family:var(--mono);font-size:12px}
    .timeline-year.cancelled{background:#f3d8d1;color:#772f29;border-color:#d6a49c}
    .hof-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
    .info-tile{appearance:none;border:1px solid var(--line);background:var(--sand);color:var(--ink);border-radius:8px;padding:16px;text-align:left;cursor:pointer}
    .info-tile strong{display:block;font-family:var(--serif);font-size:19px}.info-tile small{color:var(--muted)}
    .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .warning{margin:16px 0;padding:15px;border-left:4px solid var(--brick);background:#f7d9d2;color:#6e2b25}
    .batch-box{margin:20px 0 0;padding:18px;background:var(--sand);border-radius:9px}
    .batch-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.batch-result{font-family:var(--mono);font-size:18px;font-weight:800}
    .batch-note{font-size:12px;color:var(--muted);margin-top:9px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(26,18,13,.58);display:none;place-items:center;padding:20px;z-index:50}
    .modal-backdrop.open{display:grid}.modal{width:min(100%,620px);max-height:min(82vh,760px);overflow:auto;background:var(--cream);color:var(--ink);border-radius:12px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .modal-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.modal-close{appearance:none;border:1px solid var(--line);background:transparent;border-radius:50%;width:38px;height:38px;cursor:pointer;color:var(--ink);font-size:20px}
    .detail-list{display:grid;gap:9px}.detail-row{padding-bottom:9px;border-bottom:1px solid var(--line)}.detail-row:last-child{border:0}.detail-row strong{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.detail-row span{display:block;margin-top:3px;overflow-wrap:anywhere}
    .source-links{display:grid;gap:8px;margin-top:14px}.source-links a{color:var(--orange);overflow-wrap:anywhere}
    @media(max-width:720px){
      .app{padding-top:16px}
      .landing-hero{grid-template-columns:1fr;padding-top:14px}
      .landing-art{width:min(82%,380px);margin:4px auto 12px;aspect-ratio:1/1;border-radius:50%;box-shadow:13px 14px 0 rgba(105,112,75,.2)}
      .landing-art>svg{padding:19%}
    }
    @media(max-width:520px){
      .topbar{margin-bottom:28px}
      .landing-hero{gap:24px;padding-bottom:30px}
      .choice-grid{grid-template-columns:1fr}
      .choice{min-height:134px}.choice svg{margin-bottom:17px}
      h1{font-size:clamp(50px,15vw,70px)}
      .hof-grid,.tile-grid,.batch-row{grid-template-columns:1fr}.hof-summary{grid-template-columns:1fr 1fr}.hof-summary .stat:last-child{grid-column:1/-1}
    }
  </style>

      const f=PARISTA_DB.famousRecipes.find(x=>x.id===state.famousId);
      if(!f)return famousList();
      const world=!!f.champion,titleText=world?f.champion.name:f.name,water=recipeWater(f),ratio=recipeRatio(f),temp=world?displayValue(f.water_temperatures_c):displayValue(f.water_temperature_c);
      const steps=timelineSteps(f.steps,f.total_time_seconds,1);
      const sourceLinks=world?(f.sources||[]).map(s=>`<a href="${escapeAttr(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.title)}</a>`).join(""):(f.provenance?.source_url?`<a href="${escapeAttr(f.provenance.source_url)}" target="_blank" rel="noopener">${escapeHTML(f.provenance.source_title)}</a>`:"");
      const brewer=world?displayValue(f.brewer):"French press";
      const beans=world?beanSummary(f.beans):`${nice(f.recommended_roast)} roast · ${nice(f.cup_style)}`;
      return shell(`<div class="recipe-top"><div class="method-icon">${world?icons.cup:icons.french}</div><div>${validationBadge(f)}<h2 style="margin-top:9px">${escapeHTML(titleText)}</h2><p>${world?`${f.year} · ${escapeHTML(f.champion.represented_country)} · ${escapeHTML(f.competition.location)}`:escapeHTML(f.provenance.author_or_brand)}</p></div></div>
      <div class="card">
        <div class="hof-summary"><div class="stat"><strong>${Number.isFinite(f.coffee_g)?f.coffee_g+"g":"Not disclosed"}</strong><span>Coffee</span></div><div class="stat"><strong>${Number.isFinite(water)?water+"g":"Not disclosed"}</strong><span>Water</span></div><div class="stat"><strong>${ratio?`1:${ratio.toFixed(1)}`:"—"}</strong><span>Ratio</span></div></div>
        <div class="tile-grid"><button class="info-tile" data-modal="equipment"><small>${world?"Equipment used":"Brewer"}</small><strong>${escapeHTML(brewer)}</strong></button><button class="info-tile" data-modal="beans"><small>${world?"Beans":"Cup direction"}</small><strong>${escapeHTML(beans)}</strong></button></div>
        ${!world&&f.validation_status==="requires_cupping_validation"?`<div class="warning"><strong>PARISTA draft:</strong> this recipe requires cupping validation before it should be presented as a house recommendation.</div>`:""}
        <section class="section"><div class="label">Schedule <small>${formatTime(f.total_time_seconds)}</small></div><ol class="steps">${steps.map(s=>`<li><div>${escapeHTML(s[0])}<span class="step-time">${escapeHTML(s[1])}</span></div></li>`).join("")}</ol></section>
        ${calculatorMarkup(ratio,water,f.coffee_g,`famous:${f.id}`)}
        ${sourceLinks?`<div class="source-note"><div><strong>Sources</strong><div class="source-links">${sourceLinks}</div></div></div>`:""}
      </div><div class="actions"><button class="btn gold" id="startFamousGuide">Start guided brew →</button><button class="btn ghost" data-nav="famous">Back to Hall of Fame</button></div>`);
    }
    function guide(){
      const brew=currentBrew(),g=state.guide,step=brew.steps[g.index];
      if(!step){finishBrew();return ""}
      const secs=step[2], timed=Number.isFinite(secs), isCountUp=secs===0;
      if(!state.famousBrew&&state.method==="cold"&&g.index===1&&!g.running&&g.elapsed===0){
        step[2]=g.coldHours*3600;step[1]=g.coldHours+" hours";
      }
      const display=isCountUp?formatTime(g.elapsed):timed?formatTime(g.remaining||step[2]):"Ready";
      const progress=timed&&!isCountUp&&step[2]?Math.max(0,Math.min(1,(g.remaining||step[2])/step[2])):1;
      return shell(`<div class="card timer-card"><p class="step-count">${escapeHTML(brew.name)} · Step ${g.index+1} of ${brew.steps.length}</p>
        <div class="timer-wrap ${g.running?"running":""}" style="--p:${progress}"><div class="bloom-ring"></div><div class="bloom-ring"></div><div class="bloom-ring"></div>
          <svg class="progress" viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="110"/><circle class="arc" cx="120" cy="120" r="110" style="stroke-dashoffset:${691*(1-progress)}"/></svg>
          <div class="timer-time">${display}</div></div>
        <p class="current-instruction">${step[0]}</p>${step[1]&&step[1]!=="count up"?`<span class="guide-range">${state.famousBrew?`Starts ${step[1]}`:`Manual range: ${step[1]}`}</span>`:""}
        ${!state.famousBrew&&state.method==="cold"&&g.index===1&&!g.running?`<div class="chips" id="coldHours" style="justify-content:center;margin:18px 0">${[12,15,18].map(h=>`<button class="chip ${g.coldHours===h?"active":""}" data-value="${h}">${h} hours</button>`).join("")}</div>`:""}
        <div class="timer-actions actions">${timed?`<button class="btn gold" id="toggleTimer">${g.running?"Pause":"Start"}</button>`:""}<button class="btn" id="nextStep">${g.index===brew.steps.length-1?"Finish brew":"Next step →"}</button></div>
        ${timed?`<button class="text-link" id="resetTimer">Reset timer</button>`:""}
      </div>`);
    }
    function done(){
      return shell(`<div class="card center"><div class="done-mark">✓</div><p class="eyebrow">Brew logged</p><h2>Now, taste.</h2><p class="lede" style="margin-left:auto;margin-right:auto">Notice sweetness, acidity, finish, and texture. The cup is the measurement that matters.</p>
      <div class="actions"><button class="btn gold" data-nav="diagnose">Diagnose the taste</button><button class="btn" data-nav="landing">Back home</button></div></div>`);
    }
    function diagnose(){
      return shell(title("Taste dial-in","What did the cup say?","Change one thing at a time. Start with the highest-leverage adjustment.")+
      `<div class="card"><div class="symptoms">${Object.keys(symptomData).map(k=>`<button class="symptom" data-symptom="${k}">${symptomNames[k]}</button>`).join("")}</div><div id="diagnosis"></div></div>`);
    }
    async function logScreen(){
      const logs=await getLogs();
      app.innerHTML=shell(title("Brew Log","Your last cups.","A lightweight record of completed guided brews, newest first.")+
      `<div class="card">${logs.length?logs.map(l=>`<div class="method-row"><div class="mini-icon">${l.famousId?icons.cup:iconFor(l.method)}</div><div class="grow"><strong>${escapeHTML(l.name||methods[l.method]?.name||nice(l.method))}</strong><small>${l.famousId?"Hall of Fame recipe":`${nice(l.roast)} roast`}</small><div class="log-date">${new Date(l.timestamp).toLocaleString()}</div></div>${l.famousId?`<button class="btn small" data-famous="${l.famousId}">Open</button>`:`<button class="btn small" data-method="${l.method}">Brew again</button>`}</div>`).join(""):`<div class="empty">${icons.cup}<h3>No brews logged yet</h3><p>Complete a guided brew and it will appear here.</p></div>`}</div>
      ${logs.length?`<button class="text-link" id="clearLog">Clear brew log</button>`:""}`);
      bind();
    }
    function render(){
      const views={landing,manual,scan,confirm,equipment,recommendation:recommend,recipe,browse,guide,done,diagnose,famous:famousList,famousDetail};
      if(state.screen==="log"){logScreen();return}
      app.innerHTML=(views[state.screen]||landing)();
      window.scrollTo(0,0); bind();
    }
    function bind(){
      $$("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
      $$("[data-method]").forEach(b=>b.onclick=()=>openMethod(b.dataset.method));
      $$("[data-chips]").forEach(group=>$$(".chip",group).forEach(b=>b.onclick=()=>{state.bean[group.dataset.chips]=b.dataset.value;$$(".chip",group).forEach(x=>x.classList.toggle("active",x===b))}));
      $("#manualStart")?.addEventListener("click",()=>{state.source="manual";go("manual")});
      $("#scanStart")?.addEventListener("click",()=>{state.source="scan";go("scan")});
      $("#famousStart")?.addEventListener("click",()=>go("famous"));
      $("#toEquipment")?.addEventListener("click",()=>{state.bean.origin=$("#origin")?.value.trim()||"";go("equipment")});
      $("#takePhoto")?.addEventListener("click",()=>$("#cameraInput").click());
      $("#choosePhoto")?.addEventListener("click",()=>$("#libraryInput").click());
      $("#manualFallback")?.addEventListener("click",()=>{state.source="manual";go("manual")});
      $("#grinderChips")&&$$(".chip",$("#grinderChips")).forEach(b=>b.onclick=()=>{state.grinder=b.dataset.value;render()});
      $$(".check input").forEach(c=>c.onchange=()=>{state.owned=$$(".check input:checked").map(x=>x.value);const small=$(".label small");if(small)small.textContent=state.owned.length?state.owned.length+" selected":"All considered"});
      $("#recommend")?.addEventListener("click",()=>{state.recommendation=scoreMethods();state.method=state.recommendation.primary.id;state.band=roastBand(state.bean.roast);go("recommendation")});
      $("#startPrimary")?.addEventListener("click",()=>{state.method=state.recommendation.primary.id;startGuide()});
      $("#bandChips")&&$$(".chip",$("#bandChips")).forEach(b=>b.onclick=()=>{state.band=b.dataset.value;render()});
      $("#startGuide")?.addEventListener("click",startGuide);
      $$('[data-famous]').forEach(b=>b.onclick=()=>{state.famousId=b.dataset.famous;go("famousDetail")});
      $("#famousSearch")?.addEventListener("input",e=>{state.famousQuery=e.target.value;const pos=e.target.selectionStart;render();const input=$("#famousSearch");input?.focus();input?.setSelectionRange(pos,pos)});
      $("#famousFilters")&&$$(".chip",$("#famousFilters")).forEach(b=>b.onclick=()=>{state.famousFilter=b.dataset.value;render()});
      $("#startFamousGuide")?.addEventListener("click",startFamousGuide);
      $$('[data-modal]').forEach(b=>b.onclick=()=>showFamousModal(b.dataset.modal));
      $$('[data-batch-input]').forEach(input=>{input.oninput=()=>updateBatch(input);updateBatch(input)});
      $("#toggleTimer")?.addEventListener("click",toggleTimer);
      $("#nextStep")?.addEventListener("click",nextStep);
      $("#resetTimer")?.addEventListener("click",resetCurrent);
      $("#coldHours")&&$$(".chip",$("#coldHours")).forEach(b=>b.onclick=()=>{state.guide.coldHours=+b.dataset.value;state.guide.remaining=+b.dataset.value*3600;render()});
      $$("[data-symptom]").forEach(b=>b.onclick=()=>showDiagnosis(b.dataset.symptom,b));
      $("#clearLog")?.addEventListener("click",clearLog);
    }
    function go(screen){stopTimer(false);if(screen!=="guide")state.famousBrew=null;state.previous=state.screen;state.screen=screen;render()}
    function openMethod(id){stopTimer(false);state.famousBrew=null;state.previous=state.screen;state.method=id;state.band=roastBand(state.bean.roast);state.screen="recipe";render()}
    function updateBatch(input){
      const ratio=+input.dataset.ratio,water=+input.value,result=input.closest(".batch-box")?.querySelector("[data-batch-result]");
      if(result)result.textContent=Number.isFinite(water)&&water>0&&ratio>0?`${(water/ratio).toFixed(1)} g`:"—";
    }
    function showFamousModal(kind){
      const f=PARISTA_DB.famousRecipes.find(x=>x.id===state.famousId);if(!f)return;
      if(f.champion){
        if(kind==="equipment")openModal("Equipment used",detailRows({brewer:f.brewer,...f.tools}));
        else openModal("Competition beans",detailRows(f.beans));
      }else{
        if(kind==="equipment")openModal("Brewer and parameters",detailRows({method:f.method,grind:f.grind,temperature_c:f.water_temperature_c,total_time_seconds:f.total_time_seconds}));
        else openModal("Cup direction",detailRows({recommended_roast:f.recommended_roast,cup_style:f.cup_style,tags:f.tags,notes:f.notes}));
      }
    }
    function startFamousGuide(){
      const f=PARISTA_DB.famousRecipes.find(x=>x.id===state.famousId);if(!f)return;
      const input=$("[data-batch-input]"),baseWater=recipeWater(f),desired=input?+input.value:baseWater;
      const scale=Number.isFinite(desired)&&Number.isFinite(baseWater)&&baseWater>0?desired/baseWater:1;
      state.famousBrew={id:f.id,name:f.champion?`${f.champion.name} · ${f.year}`:f.name,steps:timelineSteps(f.steps,f.total_time_seconds,scale),source:f};
      startGuide();
    }
    function roastBand(roast){if(roast==="very light"||roast==="light")return "light";if(roast==="medium-dark"||roast==="dark")return "dark";return "medium"}
    function normalizeBand(id,band){
      const bs=Object.keys(methods[id].bands);
      if(bs.includes(band))return band;
      if(band==="dark"&&bs.includes("medium"))return "medium";
      if(band==="medium"&&bs.includes("dark"))return "dark";
      if(band==="light"&&bs.includes("medium"))return "medium";
      return bs[0];
    }
    function conditionMatches(condition,facts){
      const actual=facts[condition.field];
      if(condition.op==="eq")return actual===condition.value;
      if(condition.op==="in")return condition.values.includes(actual);
      if(condition.op==="notIn")return !condition.values.includes(actual);
      return false;
    }
    function ruleMatches(rule,facts){
      if(rule.all&&!rule.all.every(c=>conditionMatches(c,facts)))return false;
      if(rule.any&&!rule.any.some(c=>conditionMatches(c,facts)))return false;
      return true;
    }
    function scoreMethods(){
      const facts={...state.bean,grinder:state.grinder};
      const scores=Object.fromEntries(methodIds.map(id=>[id,0]));
      const reasons=Object.fromEntries(methodIds.map(id=>[id,[]]));
      const notes=[],activeRules=[];
      PARISTA_DB.recommendationRules.forEach(rule=>{
        if(!ruleMatches(rule,facts))return;
        activeRules.push(rule.id);
        Object.entries(rule.effects).forEach(([id,points])=>{
          scores[id]+=points;
          if(points>0&&rule.reason)reasons[id].push(rule.reason);
        });
        if(rule.note)notes.push(rule.note);
      });
      if(state.owned.length)methodIds.forEach(id=>{if(!state.owned.includes(id)){scores[id]-=5;reasons[id].push("would require a brewer you did not select")}});
      const ranked=methodIds.map(id=>({id,score:scores[id],reason:reasons[id][0]||methods[id].tag.toLowerCase()})).sort((a,b)=>b.score-a.score);
      const avoid=ranked.slice().reverse().filter(x=>x.score<=-2).slice(0,2).map(x=>({id:x.id,why:state.owned.length&&!state.owned.includes(x.id)?"Not in your selected equipment, and a weaker bean match.":"Less forgiving for this bean and grinder combination."}));
      if(!notes.length)notes.push("The manual has no strong warning for this combination; begin with the baseline and follow taste plus flow.");
      if(state.owned.length&&!state.owned.includes(ranked[0].id))notes.unshift("The top match is not in your selected equipment; the runner-up may be the practical choice today.");
      return {primary:ranked[0],second:ranked[1],avoid,notes:[...new Set(notes)].slice(0,3),energy:energy(),activeRules};
    }
    function energy(){
      const model=PARISTA_DB.energy;
      let n=model.roast[state.bean.roast]??2;
      n+=model.grinder[state.grinder]??0;
      n=Math.max(0,Math.min(4,Math.round(n)));
      return model.bands[n];
    }
    function startGuide(){stopTimer(false);state.guide={index:0,running:false,elapsed:0,remaining:0,interval:null,coldHours:15};state.screen="guide";render()}
    function currentBrew(){
      if(state.famousBrew)return state.famousBrew;
      const m=methods[state.method],b=normalizeBand(state.method,state.band);
      return {id:state.method,name:m.name,steps:m.bands[b].steps,source:null};
    }
    function currentStep(){return currentBrew().steps[state.guide.index]}
    function resetCurrent(){stopTimer(false);state.guide.elapsed=0;const s=currentStep();state.guide.remaining=!state.famousBrew&&state.method==="cold"&&state.guide.index===1?state.guide.coldHours*3600:(s[2]||0);render()}
    function toggleTimer(){
      const g=state.guide,s=currentStep(); if(g.running){stopTimer(false);render();return}
      if(s[2]>0&&!g.remaining)g.remaining=s[2];g.running=true;render();
      g.interval=setInterval(()=>{if(s[2]===0)g.elapsed++;else{g.remaining--;if(g.remaining<=0){g.remaining=0;stopTimer(false);toast("Step complete");render();return}}updateTimerDOM(s)},1000);
    }
    function updateTimerDOM(s){
      const el=$(".timer-time");if(el)el.textContent=s[2]===0?formatTime(state.guide.elapsed):formatTime(state.guide.remaining);
      if(s[2]>0){const arc=$(".arc"),p=Math.max(0,state.guide.remaining/s[2]);if(arc)arc.style.strokeDashoffset=691*(1-p)}
    }
    function stopTimer(resetFlag=false){const g=state.guide;if(g.interval)clearInterval(g.interval);g.interval=null;g.running=false;if(resetFlag){g.elapsed=0;g.remaining=0}}
    function nextStep(){
      stopTimer(false);const steps=currentBrew().steps;
      if(state.guide.index>=steps.length-1){finishBrew();return}
      state.guide.index++;state.guide.elapsed=0;const s=steps[state.guide.index];state.guide.remaining=!state.famousBrew&&state.method==="cold"&&state.guide.index===1?state.guide.coldHours*3600:(s[2]||0);render();
    }
    async function finishBrew(){stopTimer(false);await addLog();state.screen="done";render()}
    function formatTime(sec){sec=Math.max(0,Math.round(sec));if(sec>=3600){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return `${h}:${String(m).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`}
    function showDiagnosis(key,button){$$(".symptom").forEach(x=>x.classList.toggle("active",x===button));const d=PARISTA_DB.diagnosis[key];$("#diagnosis").innerHTML=`<div class="diagnosis"><p class="eyebrow">Likely issue</p><h3>${d.issue}</h3><ol><li><strong>Change first:</strong> ${d.first}</li><li><strong>Then, if needed:</strong> ${d.second}</li></ol><div class="source-note">Manual section ${PARISTA_DB.diagnosisSource.section}, pages ${PARISTA_DB.diagnosisSource.pages.join("–")}.</div></div>`}
    async function getLogs(){try{const r=await storage.get("parista-brew-log");return JSON.parse(r?.value||"[]")}catch{return []}}
    async function addLog(){const logs=await getLogs();logs.unshift(state.famousBrew?{method:"famous",famousId:state.famousBrew.id,name:state.famousBrew.name,timestamp:new Date().toISOString()}:{method:state.method,roast:state.bean.roast,timestamp:new Date().toISOString(),origin:state.bean.origin});await storage.set("parista-brew-log",JSON.stringify(logs.slice(0,30)))}
    async function clearLog(){await storage.set("parista-brew-log","[]");toast("Brew log cleared");render()}
    function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
    function escapeHTML(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function escapeAttr(s){return escapeHTML(s)}
    async function scanImage(file){
      const status=$("#scanStatus");status.innerHTML=`<div class="status">Reading the bag…</div>`;
      try{
        const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file)});
        const response=await fetch("https://parista-proxy.a-humaidi86.workers.dev",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({image:base64,mediaType:file.type||"image/jpeg"})});
        if(!response.ok){const errBody=await response.json().catch(()=>({}));throw new Error(errBody.error||`Scan service returned ${response.status}.`)}
        const out=await response.json(),raw=out.content?.find(x=>x.type==="text")?.text||"",data=JSON.parse(raw.replace(/^```json\s*|```$/g,"").trim());
        const valid=(key,val)=>fields[key]?.includes(val);
        if(valid("roast",data.roast))state.bean.roast=data.roast;
        if(valid("process",data.process))state.bean.process=data.process;
        state.bean.origin=[data.origin,data.variety].filter(Boolean).join(" · ");
        state.source="scan";go("confirm");
      }catch(err){
        status.innerHTML=`<div class="status error"><strong>We couldn’t read this bag.</strong><br>${escapeHTML(err.message)} You can still enter the details by hand.</div>`;
      }
    }
    $("#cameraInput").onchange=e=>e.target.files[0]&&scanImage(e.target.files[0]);
    $("#libraryInput").onchange=e=>e.target.files[0]&&scanImage(e.target.files[0]);
    $("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    render();
  })();
  </script>
</body>
